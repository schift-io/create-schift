<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}} — 로펌 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Pretendard', sans-serif; background: #0b0d10; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; border-bottom: 1px solid #1d2127; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; color: #fff; }
    header .badge { font-size: 11px; padding: 2px 8px; border-radius: 9999px; background: #1a3a2a; color: #4ade80; }
    .disclaimer { font-size: 12px; padding: 10px 24px; background: #21181a; color: #fca5a5; border-bottom: 1px solid #3a1f21; }
    .intake { padding: 12px 24px; display: flex; gap: 8px; border-bottom: 1px solid #1d2127; }
    .intake input { flex: 1; padding: 8px 12px; border: 1px solid #2a3446; background: #0f131a; color: #fff; border-radius: 6px; font-size: 13px; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 720px; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #151a21; border: 1px solid #253040; }
    .setup { margin: 40px auto; max-width: 540px; padding: 24px; background: #151a21; border: 1px solid #253040; border-radius: 12px; }
    .setup h2 { margin-bottom: 12px; font-size: 18px; }
    .setup code { display: block; padding: 10px; background: #0a0d12; border: 1px solid #1d2127; border-radius: 6px; font-size: 12.5px; margin: 8px 0; }
    .setup a { color: #60a5fa; }
    #input-area { padding: 14px 24px; border-top: 1px solid #1d2127; display: flex; gap: 10px; }
    #input-area input { flex: 1; padding: 11px 14px; border: 1px solid #2a3446; background: #0f131a; color: #fff; border-radius: 8px; }
    #input-area button { padding: 11px 22px; border: 0; background: #1d4ed8; color: #fff; border-radius: 8px; font-weight: 500; cursor: pointer; }
    .assign-cta { padding: 10px 24px; background: #1a2a44; color: #93c5fd; font-size: 12.5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>{{PROJECT_NAME}} — 로펌 1차 상담</h1>
    <span class="badge">Schift Cloud</span>
  </header>
  <div class="disclaimer">※ 1차 응대 AI 어시스턴트입니다. 법률 자문이 아니며 최종 판단은 배정된 변호사가 수행합니다.</div>

  <div id="setup" class="setup" style="display:none">
    <h2>설정이 필요합니다</h2>
    <p>이 템플릿은 Schift Cloud API 키가 있어야 동작합니다.</p>
    <ol style="padding-left:20px;line-height:1.9;">
      <li><a href="https://app.schift.io/api-keys" target="_blank">https://app.schift.io/api-keys</a> 에서 키 발급</li>
      <li><code>.env</code>에 <b>SCHIFT_API_KEY</b> 입력</li>
      <li><code>npm run dev</code> 재시작</li>
    </ol>
    <div id="setup-missing"></div>
  </div>

  <div id="chat-ui">
    <div class="intake">
      <input id="client-name" placeholder="의뢰인 이름(선택)" />
      <input id="matter" placeholder="사건 유형(예: 임대차)" />
    </div>
    <div id="messages"></div>
    <div class="assign-cta" id="assign-cta" style="display:none" onclick="assignLawyer()">→ 변호사 배정 요청</div>
    <div id="input-area">
      <input id="msg-input" placeholder="의뢰 내용을 입력하세요..." />
      <button onclick="send()">보내기</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("msg-input");
    const setup = document.getElementById("setup");
    const chat = document.getElementById("chat-ui");
    const assignCta = document.getElementById("assign-cta");

    (async () => {
      const r = await fetch("/api/health").then((x) => x.json());
      if (r.status !== "ok") {
        setup.style.display = "block";
        chat.style.display = "none";
        document.getElementById("setup-missing").innerHTML =
          "<p style='margin-top:12px;color:#fca5a5'>누락: " + (r.missingEnv || []).join(", ") + "</p>";
      }
    })();

    function addMsg(role, text) {
      const d = document.createElement("div");
      d.className = "msg " + role;
      d.textContent = text;
      messagesEl.appendChild(d);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return d;
    }

    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    async function send() {
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      addMsg("user", q);
      const pending = addMsg("assistant", "검토 중...");
      try {
        const resp = await fetch("/api/consult", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: q,
            clientName: document.getElementById("client-name").value || null,
          }),
        });
        const data = await resp.json();
        pending.textContent = data.answer ?? data.error ?? "응답 없음";
        if (data.intake && data.intake.assignmentRecommended) {
          assignCta.style.display = "block";
        }
      } catch (err) {
        pending.textContent = "오류: " + err.message;
      }
    }

    async function assignLawyer() {
      const payload = {
        clientName: document.getElementById("client-name").value,
        matter: document.getElementById("matter").value,
        urgency: "normal",
      };
      const resp = await fetch("/api/assign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (data.assigned) {
        assignCta.textContent = "✓ 배정 요청 전송 — 담당 변호사가 곧 연락합니다.";
        assignCta.style.background = "#1a3a2a";
        assignCta.style.color = "#4ade80";
      }
    }
  </script>
</body>
</html>
